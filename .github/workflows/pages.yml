name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - name: Install WASM build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang llvm
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable
      - name: Record compiler version
        id: compiler
        run: echo "version=$(rustc --version | tr ' ' '-')" >> "$GITHUB_OUTPUT"
      - name: Cache Rust build and binding tools
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/wasm-bindgen-test-runner
            ~/.cargo/bin/wasm2es6js
            target
          key: ${{ runner.os }}-picoli-wasm-${{ steps.compiler.outputs.version }}-${{ hashFiles('Cargo.lock') }}
      - name: Install matching wasm-bindgen CLI
        run: |
          version=$(python3 -c 'import tomllib; lock = tomllib.load(open("Cargo.lock", "rb")); print(next(p["version"] for p in lock["package"] if p["name"] == "wasm-bindgen"))')
          cargo install wasm-bindgen-cli --version "=$version" --locked
      - name: Build locked WASM package
        env:
          CC_wasm32_unknown_unknown: clang
          AR_wasm32_unknown_unknown: llvm-ar
        run: |
          # Cargo metadata also reads manifests outside the active target graph.
          cargo fetch --locked
          cargo build --locked -p picoli-wasm --target wasm32-unknown-unknown --profile wasm-release
          wasm-bindgen target/wasm32-unknown-unknown/wasm-release/picoli_wasm.wasm --target web --out-dir web/pkg
      - name: Check demo modules and tests
        run: |
          node --check scripts/build-site.mjs
          for file in web/*.js web/pkg/picoli_wasm.js; do
            node --input-type=module --check < "$file"
          done
          node --test web/tests/*.test.mjs
          node web/tests/wasm-smoke.mjs
      - name: Assemble static site
        run: node scripts/build-site.mjs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: dist

  publish-artifacts:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: published
      - name: Download the exact Pages artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages-artifact
      - name: Update generated gh-pages branch without rewriting history
        working-directory: published
        env:
          SOURCE_SHA: ${{ github.sha }}
          ARTIFACT_DIR: ${{ runner.temp }}/pages-artifact
          SITE_DIR: ${{ runner.temp }}/pages-site
        run: |
          set -euo pipefail
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$latest" != "$SOURCE_SHA" ]; then
            printf '%s\n' 'A newer main commit exists; refusing to publish a stale build.' >&2
            exit 1
          fi
          mkdir -p "$SITE_DIR"
          tar -xf "$ARTIFACT_DIR/artifact.tar" -C "$SITE_DIR"
          if git ls-remote --exit-code --heads origin gh-pages; then
            git fetch origin gh-pages
            git checkout -B gh-pages FETCH_HEAD
          else
            status=$?
            if [ "$status" -ne 2 ]; then exit "$status"; fi
            git checkout --orphan gh-pages
          fi
          git rm -rf --ignore-unmatch .
          cp -a "$SITE_DIR/." .
          git add --all
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Deploy demo from $SOURCE_SHA"
          git push origin HEAD:refs/heads/gh-pages

  deploy:
    needs: [build, publish-artifacts]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Reject superseded main builds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          latest=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          if [ "$latest" != "$SOURCE_SHA" ]; then
            printf '%s\n' 'A newer main commit exists; refusing to deploy a stale build.' >&2
            exit 1
          fi
      # Deploy directly: GITHUB_TOKEN pushes to gh-pages do not trigger another workflow.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
