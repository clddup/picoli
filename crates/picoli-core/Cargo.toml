[package]
name = "picoli-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
image.workspace = true
serde.workspace = true
thiserror.workspace = true
zune-core.workspace = true
zune-jpeg = { workspace = true, features = ["experimental-coefficients"] }
jpeg-encoder = { workspace = true, features = ["experimental-coefficients", "benchmark"] }
png.workspace = true
moxcms = "=0.8.1"
# Already used transitively by PNG; expose owned snapshots and chunk CRCs.
miniz_oxide = "=0.9.1"
crc32fast = "=1.5.5"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libdeflater = "=1.25.2"
[target.'cfg(target_arch = "wasm32")'.dependencies]
libdeflater = { version = "=1.25.2", features = ["freestanding"] }

[dev-dependencies]
libdeflate-sys = "=1.25.2"
